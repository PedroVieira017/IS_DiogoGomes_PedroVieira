services:
  app:
    image: ipvc-multimodal:latest
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    init: true
    volumes:
      - .:/app
    env_file:
      - path: ./.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONPATH=/app:/app/VisuLogic/VisuLogic-Eval
      - OLLAMA_ENDPOINT=http://host.docker.internal:11434/api/generate
      - OLLAMA_VISION_MODEL=llava
      - OLLAMA_MODEL=llama3.1:8b
    stdin_open: true
    tty: true
    command: ["python", "integra.py"]
